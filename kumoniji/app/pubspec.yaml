name: kumoniji
description: "Kumoniji — 4-player tile game"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.4.0
  google_sign_in: ^7.2.0
  http: ^1.6.0
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/tiles/
    - assets/icons/
    - assets/brand/
    - assets/backgrounds/
    - assets/boards/
    - assets/audio/
    - assets/audio/sfx/
    - assets/icons/home/
    - assets/buttons/
    - assets/legal/
    - assets/currency/
    - assets/currency/digits/
