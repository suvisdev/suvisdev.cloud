<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="kumoniji">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>kumoniji</title>
  <link rel="manifest" href="manifest.json">
  <!-- 엔진이 차례로 받던 파일을 처음부터 같이 받는다 — 새로고침마다 파일마다 노트북까지 확인 왕복(약 0.3초)이 차례로
       쌓이던 것(페이지→시작 스크립트→앱→글꼴 목록→글꼴)을 겹친다. 캐시 규칙은 그대로(no-cache)라 배포가 바로 보인다(11-26) -->
  <link rel="preload" href="main.dart.js" as="script">
  <link rel="preload" href="assets/FontManifest.json" as="fetch" crossorigin>
  <link rel="preload" href="assets/fonts/MaterialIcons-Regular.otf" as="fetch" crossorigin>
  <link rel="preload" href="assets/fonts/fallback/Roboto-Regular.ttf" as="fetch" crossorigin>
  <!-- 엔진이 뜨기 전(새로고침 1초 남짓) 흰 화면 대신 보이는 로딩. 첫 화면이 그려지면 flutter_bootstrap.js가 지운다(11-26) -->
  <style>
    html, body { margin: 0; height: 100%; background: #FFF9EC; }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #loading div { width: 40px; height: 40px; border: 4px solid #F2D7E2; border-top-color: #8A4A63;
      border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading" aria-label="loading"><div></div></div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
