# 쿠모니지(4인 타일 게임) 1단계 — 서버(FastAPI)가 웹 앱 정적 파일까지 낸다. 배포: kumoniji/deploy.sh
# 판은 메모리에만 있으므로 replicas는 1로 고정(늘리면 판이 다른 파드로 가서 404).
# 계정은 호스트 도커의 kumoniji-db(Postgres, :5434) — kumoniji/db/docker-compose.yaml. 설정·비밀은 Secret kumoniji-env(deploy.sh가 .env로 만든다).
# 터널: Cloudflare 대시보드 suvisdev.cloud 터널에 kumoniji.suvisdev.cloud → http://nginx:80 (nginx-alias.yaml → Traefik)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kumoniji
  namespace: suvisdev
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kumoniji
  template:
    metadata:
      labels:
        app: kumoniji
    spec:
      automountServiceAccountToken: false
      hostAliases: # 호스트(WSL)의 도커 포트 — backend.yaml과 같은 방식
        - ip: "10.42.0.1"
          hostnames:
            - host.docker.internal
      containers:
        - name: kumoniji
          image: kumoniji:latest
          imagePullPolicy: Never
          envFrom:
            - secretRef:
                name: kumoniji-env
          ports:
            - containerPort: 8000
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: "1", memory: 512Mi } # hard 봇 끝판 계산 — 0.5코어에선 한 수 최대 0.75초(11-21 측정). argon2 64MiB × 동시 2
          readinessProbe:
            httpGet: { path: /, port: 8000 }
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: kumoniji
  namespace: suvisdev
spec:
  selector:
    app: kumoniji
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kumoniji
  namespace: suvisdev
spec:
  ingressClassName: traefik
  rules:
    - host: kumoniji.suvisdev.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kumoniji
                port:
                  number: 8000
