services:
  # nginx 구동
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    command: '/bin/sh -c ''while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'''

  certbot:
    image: certbot/certbot
    container_name: certbot
    restart: always
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"


  # 1. 백엔드(FastAPI) 서비스 정의
  backend:
    build:
      context: ./suvisdev      # suvisdev 폴더 안에 있는 Dockerfile을 읽어라
      dockerfile: Dockerfile
    # auth와 **같은 태그**를 공유한다. 예전엔 태그를 안 줘서 compose가
    # suvisdevcloud-backend / suvisdevcloud-auth 로 따로 태깅했고, 완전히 동일한
    # 8.84GB짜리 pip 레이어를 두 벌 물고 있어 EC2 30GB 디스크가 배포 중 자주
    # 터졌다(하나를 지워도 다른 쪽이 참조 중이라 공간이 안 풀림, 2026-08-05).
    image: suvisdev-app:latest
    restart: unless-stopped
    # .dockerignore가 .env를 이미지에서 제외하므로(비밀번호 커밋 방지),
    # 컨테이너 실행 시점에 호스트의 .env를 env_file로 주입한다.
    # 실행: docker compose --env-file suvisdev/.env up -d --build backend
    env_file:
      - ./suvisdev/.env
    environment:
      - ENV=production
      # .env의 DATABASE_URL/MOVA_DATABASE_URL은 localhost:5432(호스트에서 알렘빅 실행용)라
      # 컨테이너 안에서는 자기 자신을 가리켜 못 붙는다. db 컨테이너는 같은 네트워크에서
      # 서비스명 "db"로 접근하므로 여기서 덮어쓴다.
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - MOVA_DATABASE_URL=postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Ollama(EXAONE)는 호스트에서 systemd로 돌아서 컨테이너 밖에 있다.
      # host.docker.internal + OLLAMA_HOST=0.0.0.0(호스트 쪽 ollama.service 설정)로 접근.
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      # AWQ 직접 서빙(레거시, 지금은 안 씀)도 Ollama와 동일하게 호스트 별도 프로세스
      # (~/.venv-exaone, model_servers/awq_server/serve.py --port 8100)로 떠 있다.
      - AWQ_SERVER_URL=http://host.docker.internal:8100
      # mova 채팅 RAG 답변 생성 — 주기 재학습되는 공용 LoRA 어댑터(model_servers/lora_server,
      # ~/.venv-exaone, --port 8200). train_mova_lora.py가 남긴 ~/lora_adapters/LATEST를
      # 읽어 베이스 모델(현재 Qwen2.5-1.5B, VRAM 여유 생기면 EXAONE-AWQ로 교체 가능)+
      # 최신 어댑터를 서빙한다.
      # EC2처럼 호스트에 lora_server가 없는 환경은 .env의 LORA_SERVER_URL로 원격
      # (Cloudflare Tunnel 등) 주소를 덮어쓴다 — 없으면 기존 기본값 유지.
      - LORA_SERVER_URL=${LORA_SERVER_URL:-http://host.docker.internal:8200}
      # ontology(Hub) 크롤러가 대상(website+keyword)을 읽어오는 곳 — redis 컨테이너는
      # 같은 compose 네트워크라 서비스명으로 바로 붙는다 (host.docker.internal 불필요).
      - REDIS_URL=redis://redis:6379/0
    # harvester(scripts/harvester_cli.py, 어드민 크롤러/스크래퍼 화면)가 쓰는 출력 폴더.
    # 바인드 마운트가 없으면 컨테이너 쓰기 레이어에만 남아 재생성 시 사라진다.
    volumes:
      - ./suvisdev/datasets:/suvisdev/datasets
      - ./suvisdev/apps/ontology/resources/crawled:/suvisdev/apps/ontology/resources/crawled
      # gildle scored_edges.json(77MB)은 gitignore 대상이라 이미지에 최신본이 없다.
      # 로컬에서 생성 후 scp로 올리면 재빌드 없이 반영되도록 호스트를 마운트한다.
      - ./suvisdev/apps/gildle/data:/suvisdev/apps/gildle/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
#    deploy:
 #     resources:
  #      reservations:
   #       devices:
    #        - driver: nvidia
     #         count: all
      #        capabilities: [gpu]

  # 1-1. auth 게이트웨이 — RS256 JWT 발급 전용. nginx(nginx/conf.d/app.conf)가
  # api.suvisdev.cloud의 /auth/*, /.well-known/jwks.json을 이 컨테이너로 프록시한다
  # (susu 카카오 모바일 로그인부터 실트래픽 연결).
  # backend와 같은 이미지/컨텍스트를 재사용하고 command만 다르게 띄운다.
  # 실행: docker compose --env-file suvisdev/.env up -d --build auth
  auth:
    build:
      context: ./suvisdev
      dockerfile: Dockerfile
    # backend와 동일한 이미지 — 빌드는 한 번만 일어나고(두 번째는 캐시 히트로
    # 같은 태그를 가리킬 뿐) 디스크엔 한 벌만 남는다. 차이는 아래 command뿐이다.
    image: suvisdev-app:latest
    command: uvicorn auth_main:app --host 0.0.0.0 --port 9000
    restart: unless-stopped
    env_file:
      - ./suvisdev/.env
      - ./suvisdev/.env.auth
    environment:
      # get_viewer_session_factory()는 MOVA_DATABASE_URL을 DATABASE_URL보다 우선 참조한다
      # (core/matrix/grid_oracle_database_manager.ensure_viewer_database) — backend와
      # 동일하게 둘 다 덮어써야 한다. 하나만 덮어쓰면 .env의 localhost:5432 값(호스트용)로
      # 붙으려다 컨테이너 안에서 접속 실패한다.
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - MOVA_DATABASE_URL=postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 2. PostgreSQL + pgvector 서비스 정의
  # 접속·인증 정보는 suvisdev/.env 에서 주입한다 (하드코딩 금지).
  # 실행: docker compose --env-file suvisdev/.env up -d db
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data          # named volume — 컨테이너 재생성해도 데이터 유지
      - ./db/init:/docker-entrypoint-initdb.d      # 최초 기동 시 CREATE EXTENSION vector 실행
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 3. Redis
  # 실행: docker compose --env-file suvisdev/.env up -d redis
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 4. pgAdmin — 위 db(docker pgvector) 컨테이너 조회용 웹 UI
  # 실행: docker compose --env-file suvisdev/.env up -d pgadmin
  # 접속: http://localhost:5050 (로그인 후 서버 추가 시 Host=db, Port=5432,
  #       Username/Password/Maintenance DB는 suvisdev/.env의 POSTGRES_* 값)
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

  # 5. Cloudflare Tunnel — 호스트에서 systemctl로 직접 띄우던 걸 컨테이너로 이전.
  # LAN에서 backend/auth 포트(8000/9000)로 직접 접근 가능한 구멍을 없애는 게 목적 —
  # 전환 확인 전까지는 backend/auth의 ports: 를 그대로 둔다(마지막 단계에서 제거 예정).
  # 실행: docker compose --env-file suvisdev/.env up -d cloudflared
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run --token ${TUNNEL_TOKEN}
    networks: [default]  # 이 compose 파일엔 top-level networks: 블록이 없어 전부 암묵적
    # 기본 네트워크(실제 이름 suvisdev_default)를 공유한다 — backend/auth를 그 이름으로
    # 직접 명시하면 top-level 선언이 없어 별도 네트워크가 생겨 서비스명 DNS가 끊긴다.
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 6. Neo4j — GraphRAG용 그래프 DB (pgvector/PostgreSQL은 그대로 유지, 완전 교체 아님)
  # EC2 메모리(7.6GB, 컨테이너 8개 상시 기동)가 빠듯해 JVM heap/pagecache를 캡 건다.
  # 7474/7687은 인터넷에 노출하지 않는다 — nginx/Cloudflare Tunnel 전용 패턴을 따라
  # 127.0.0.1에만 바인딩(다른 서비스처럼 0.0.0.0으로 열지 않음).
  # 실행: docker compose --env-file suvisdev/.env up -d neo4j
  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data

volumes:
  db_data:
  redis_data:
  pgadmin_data:
  neo4j_data:
