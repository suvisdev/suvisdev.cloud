services:
  # 1. 백엔드(FastAPI) 서비스 정의
  backend:
    build:
      context: ./suvisdev      # suvisdev 폴더 안에 있는 Dockerfile을 읽어라
      dockerfile: Dockerfile
    ports:
      - "8000:8000"            # 내 진짜 컴퓨터의 8000번 포트와 도커의 8000번 포트를 연결해라
    # .dockerignore가 .env를 이미지에서 제외하므로(비밀번호 커밋 방지),
    # 컨테이너 실행 시점에 호스트의 .env를 env_file로 주입한다.
    # 실행: docker compose --env-file suvisdev/.env up -d --build backend
    env_file:
      - ./suvisdev/.env
    environment:
      - ENV=production
      # .env의 DATABASE_URL/MOVA_DATABASE_URL은 localhost:5432(호스트에서 알렘빅 실행용)라
      # 컨테이너 안에서는 자기 자신을 가리켜 못 붙는다. db 컨테이너는 같은 네트워크에서
      # 서비스명 "db"로 접근하므로 여기서 덮어쓴다.
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - MOVA_DATABASE_URL=postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Ollama(EXAONE)는 호스트에서 systemd로 돌아서 컨테이너 밖에 있다.
      # host.docker.internal + OLLAMA_HOST=0.0.0.0(호스트 쪽 ollama.service 설정)로 접근.
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      # AWQ 직접 서빙(레거시, 지금은 안 씀)도 Ollama와 동일하게 호스트 별도 프로세스
      # (~/.venv-exaone, awq_server/serve.py --port 8100)로 떠 있다.
      - AWQ_SERVER_URL=http://host.docker.internal:8100
      # mova 채팅 RAG 답변 생성 — 주기 재학습되는 공용 LoRA 어댑터(lora_server,
      # ~/.venv-exaone, --port 8200). train_mova_lora.py가 남긴 ~/lora_adapters/LATEST를
      # 읽어 베이스 모델(현재 Qwen2.5-1.5B, VRAM 여유 생기면 EXAONE-AWQ로 교체 가능)+
      # 최신 어댑터를 서빙한다.
      - LORA_SERVER_URL=http://host.docker.internal:8200
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # 2. PostgreSQL + pgvector 서비스 정의
  # 접속·인증 정보는 suvisdev/.env 에서 주입한다 (하드코딩 금지).
  # 실행: docker compose --env-file suvisdev/.env up -d db
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data          # named volume — 컨테이너 재생성해도 데이터 유지
      - ./db/init:/docker-entrypoint-initdb.d      # 최초 기동 시 CREATE EXTENSION vector 실행
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 3. pgAdmin — 위 db(docker pgvector) 컨테이너 조회용 웹 UI
  # 실행: docker compose --env-file suvisdev/.env up -d pgadmin
  # 접속: http://localhost:5050 (로그인 후 서버 추가 시 Host=db, Port=5432,
  #       Username/Password/Maintenance DB는 suvisdev/.env의 POSTGRES_* 값)
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  pgadmin_data:
