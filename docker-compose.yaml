services:
  # 1. 백엔드(FastAPI) 서비스 정의
  backend:
    build:
      context: ./suvisdev      # suvisdev 폴더 안에 있는 Dockerfile을 읽어라
      dockerfile: Dockerfile
    ports:
      - "8000:8000"            # 내 진짜 컴퓨터의 8000번 포트와 도커의 8000번 포트를 연결해라
    environment:
      - ENV=production
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # 2. PostgreSQL + pgvector 서비스 정의
  # 접속·인증 정보는 suvisdev/.env 에서 주입한다 (하드코딩 금지).
  # 실행: docker compose --env-file suvisdev/.env up -d db
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data          # named volume — 컨테이너 재생성해도 데이터 유지
      - ./db/init:/docker-entrypoint-initdb.d      # 최초 기동 시 CREATE EXTENSION vector 실행
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
