# Cloudflare Tunnel — 기본 replicas: 0 (파일상 보호값). deploy.sh --external-db 는 1로 바꿔 apply 한다.
#
# 2026-10-05부터 노트북·집컴 두 클러스터가 같은 터널 토큰을 쓴다. 어느 쪽 커넥터를 켤지는 사람이 아니라
# 판단기가 정한다 — 노트북 serve-agent(앱이 건강하면 1), 집컴 standby-agent(노트북 심장박동이 끊기면 1).
# DB·Redis가 집컴 한 곳이라 둘이 잠깐 겹쳐도 안전하다. 손으로 scale 하면 판단기가 5초 안에 되돌린다
# — 손으로 빼려면 판단기부터 멈춘다(k8s/failover/README.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: suvisdev
spec:
  replicas: 0
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      # 터널 라우트 중 ssh.suvisdev.cloud → ssh://host.docker.internal:22 가 호스트를 가리킨다.
      # backend.yaml과 동일하게 flannel cni0 게이트웨이(10.42.0.1 = 호스트)로 별칭을 잡는다.
      hostAliases:
        - ip: "10.42.0.1"
          hostnames:
            - host.docker.internal
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args: ["tunnel", "run", "--token", "$(TUNNEL_TOKEN)"]
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef: { name: suvisdev-env, key: TUNNEL_TOKEN }
