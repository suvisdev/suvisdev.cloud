# Cloudflare Tunnel — 기본 replicas: 0 (파일상 보호값). deploy.sh --external-db 는 1로 바꿔 apply 한다.
# 2026-11-08부터 노트북 한 대만 서빙한다. 서버 끄기·켜기(k8s/ops-agent)가 backend·auth 와 함께 0·1 로 맞춘다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: suvisdev
spec:
  replicas: 0
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      # 터널 라우트 중 ssh.suvisdev.cloud → ssh://host.docker.internal:22 가 호스트를 가리킨다.
      # backend.yaml과 동일하게 flannel cni0 게이트웨이(10.42.0.1 = 호스트)로 별칭을 잡는다.
      hostAliases:
        - ip: "10.42.0.1"
          hostnames:
            - host.docker.internal
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args: ["tunnel", "run", "--token", "$(TUNNEL_TOKEN)"]
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef: { name: suvisdev-env, key: TUNNEL_TOKEN }
