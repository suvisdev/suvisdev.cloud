# 올라마 중계기 (데스크탑) — 노트북 GPU가 살아 있으면 노트북, 아니면 데스크탑 CPU.
# 백엔드는 OLLAMA_BASE_URL=http://host.docker.internal:11435 로 이 중계기를 부른다.
# 노트북 올라마는 노트북이 연 역방향 SSH 터널(127.0.0.1:21434)로 들어온다.
global
    log stdout format raw local0 notice

defaults
    mode http
    log global
    option dontlognull
    timeout connect 3s
    timeout check 2s
    # 모델 적재와 스트리밍 응답이 길 수 있다
    timeout client 10m
    timeout server 10m
    # 연결이 안 되거나 빈 응답이면 같은 요청을 다시 보낸다. 그 사이 노트북이 빠지면 데스크탑으로 간다.
    retries 2
    option redispatch
    retry-on conn-failure empty-response

frontend ollama_in
    bind :11435
    default_backend ollama

backend ollama
    option httpchk GET /api/version
    http-check expect status 200
    # 1초마다 점검: 2번 연속 실패면 빼고, 3번 연속 성공이면 다시 넣는다.
    # 실제 요청에서 연결 오류가 한 번이라도 나면 점검을 기다리지 않고 바로 뺀다(재시도는 데스크탑으로).
    # 노트북이 빠질 때 잡혀 있던 연결은 끊는다 — 잠든 노트북에 요청이 10분 매달리지 않게.
    default-server inter 1s fastinter 500ms downinter 2s fall 2 rise 3 observe layer4 error-limit 1 on-error mark-down on-marked-down shutdown-sessions
    server laptop  127.0.0.1:21434 check
    server desktop 127.0.0.1:11434 check backup

# 상태 확인용 (데스크탑 안에서만): curl -s "127.0.0.1:8404/;csv" | cut -d, -f1,2,18
listen stats
    bind 127.0.0.1:8404
    stats enable
    stats uri /
