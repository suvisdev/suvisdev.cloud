server {
    listen 80;
    server_name api.suvisdev.cloud;

    # nginx 기본값(1MB)이 media 업로드(최대 10MB, apps/media/router.py)를
    # 413으로 막던 문제 — 백엔드 제한과 맞춰둔다.
    client_max_body_size 10M;

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # auth 게이트웨이(susu 카카오 모바일 로그인 등) — apps/auth, uvicorn auth_main:app --port 9000
    location /auth/ {
        proxy_pass http://auth:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /.well-known/jwks.json {
        proxy_pass http://auth:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
