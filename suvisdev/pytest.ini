[pytest]
markers =
    ollama: 실제 Ollama 서버가 필요한 테스트 (requires running Ollama server)
    gpu: 실제 GPU + 모델 로드가 필요한 테스트 (requires GPU + real model weights)
testpaths = apps/titanic/tests apps/mova/tests apps/gildle/tests apps/dispatch/test apps/ontology/test apps/auth/tests apps/analytics/tests shared/tests
