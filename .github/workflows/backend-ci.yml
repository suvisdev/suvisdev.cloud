# 백엔드 CI — pre-commit 게이트(.pre-commit-config.yaml)와 같은 검사를 GitHub에서 한 번 더 돈다.
# 게이트는 머신마다 설치해야 돌아서 빠질 수 있다(2026-10-01, 꺼진 사이 mypy 0→17건). CI는 빠질 수 없다.
# main push 성공 시 backend-deploy.yml이 이어 받아 노트북에 배포한다.
# .md만 바뀐 커밋은 제외 — 문서 변경으로 운영 재배포(이미지 빌드 ~6분)가 돌지 않게(2026-10-01).
name: backend-ci

on:
  push:
    branches: [main]
    paths:
      - "suvisdev/**"
      - "k8s/**"
      - ".github/workflows/backend-*.yml"
      - "!**/*.md"
  pull_request:
    paths:
      - "suvisdev/**"
      - "k8s/**"
      - ".github/workflows/backend-*.yml"
      - "!**/*.md"
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: suvisdev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: suvisdev/requirements.txt

      # OpenCV·LightGBM 런타임 라이브러리 — Dockerfile 2-1과 같은 목록
      - name: 시스템 라이브러리
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgomp1 libgl1 libglib2.0-0

      # torch 3종은 CPU 휠로 — Dockerfile 4와 같은 치환(requirements.txt는 cu126 핀 유지).
      # shapely는 gildle 지리 스크립트 테스트 3파일용(이미지엔 없어 skip되던 것을 CI에선 돌린다).
      - name: 의존성
        run: |
          sed -e 's#whl/cu126#whl/cpu#' -e 's/+cu126/+cpu/' requirements.txt > /tmp/requirements-cpu.txt
          pip install -r /tmp/requirements-cpu.txt pytest mypy==2.3.1 import-linter==2.15 ruff==0.16.9 shapely==2.1.2

      # .ipynb(코랩 노트북)·.md(문서 코드블록)는 커밋 훅과 같은 이유로 제외
      - name: ruff
        run: |
          ruff check . --extend-exclude "*.ipynb"
          ruff format --check . --extend-exclude "*.ipynb,*.md"

      - name: mypy (strict)
        run: python -m mypy --config-file pyproject.toml --explicit-package-bases apps/

      - name: import-linter (스타 토폴로지)
        run: PYTHONPATH="$PWD:$PWD/apps" lint-imports

      - name: pytest
        run: PYTHONPATH="$PWD:$PWD/apps" python -m pytest -m "not gpu and not ollama" -q -p no:cacheprovider
