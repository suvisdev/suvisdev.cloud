# 쿠모니지 CD — main에서 kumoniji-ci가 통과하면 노트북 셀프호스티드 러너(라벨 prod)가 kumoniji/deploy.sh로 배포한다.
# 사용자 결정(2026-11-28): "CI/CD가 문제없이 돌아가면 자동으로 배포돼도 된다".
# 코드는 CI가 통과한 커밋(이 체크아웃), .env는 러너 .env의 SUVISDEV_DATA_ROOT 쪽 kumoniji/.env를 쓴다.
# DB 마이그레이션(서버 시작 때 자동 적용)이 든 판은 deploy.sh가 자동 배포하지 않고 실패로 알린다 — 사용자가 덤프 뒤 손 배포.
name: kumoniji-deploy

on:
  workflow_run:
    workflows: [kumoniji-ci]
    types: [completed]
    branches: [main]
# 수동 실행(workflow_dispatch)은 두지 않는다 — CI 결과 없이 배포하게 된다. 손으로 다시 배포할 땐 노트북에서 deploy.sh.

# 묶음을 커밋마다 나눈다: 한 묶음을 같이 쓰면 대기 중인 실행이 서로를 취소한다(백엔드·길들 동기화와도, 옛 커밋
# CI 재실행과도). 러너가 하나라 잡은 어차피 하나씩 돌고, 옛 커밋은 아래 최신 확인에서 건너뛴다.
concurrency:
  group: kumoniji-deploy-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  deploy:
    # main 푸시 CI와 main에서 손으로 다시 돌린 CI(같은 묶음이라 푸시 CI를 취소할 수 있다) 둘 다 받는다. PR CI는 안 받는다.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event)
    runs-on: [self-hosted, prod]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: 러너 설정 확인
        run: |
          : "${SUVISDEV_DATA_ROOT:?러너 .env에 SUVISDEV_DATA_ROOT가 없음}"
          test -f "$SUVISDEV_DATA_ROOT/kumoniji/.env"

      # 옛 커밋은 그 커밋의 deploy.sh를 돌리기 전에 거른다(이 판단이 없던 옛 deploy.sh도 있다).
      # 잠금 안의 최종 판단(최신 main인지·이미 도는 판인지)은 deploy.sh가 다시 한다(KUMONIJI_CD=1).
      - name: 최신 main인지 확인
        id: latest
        run: |
          git fetch --no-tags --depth=1 origin main
          if git diff --quiet HEAD FETCH_HEAD -- kumoniji/ ':(exclude)kumoniji/CLAUDE.md' ':(exclude)kumoniji/_docs/'; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::배포 건너뜀 — main에 더 새 쿠모니지 변경이 있음"
          fi

      - name: 배포
        if: steps.latest.outputs.deploy == 'true'
        run: KUMONIJI_CD=1 ./kumoniji/deploy.sh

      # 건너뛴 실행도 확인한다 — 롤아웃 뒤 외부 502인 채 재실행이 '이미 배포한 판'으로 성공 처리되지 않게.
      - name: 외부 응답 확인
        run: |
          curl -fsS -o /dev/null -w 'kumoniji %{http_code}\n' --retry 10 --retry-delay 6 --retry-all-errors \
            'https://kumoniji.suvisdev.cloud/'
