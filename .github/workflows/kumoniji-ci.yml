# 쿠모니지 CI — 서버 pytest(규칙 하네스 포함) + 앱 analyze·test. main에서 통과하면 kumoniji-deploy가 자동 배포.
name: kumoniji-ci

on:
  push:
    branches: [main]
    paths:
      - "kumoniji/**"
      - ".github/workflows/kumoniji-ci.yml"
      - ".github/workflows/kumoniji-deploy.yml"
  pull_request:
    paths:
      - "kumoniji/**"
      - ".github/workflows/kumoniji-ci.yml"
      - ".github/workflows/kumoniji-deploy.yml"
  workflow_dispatch:

concurrency:
  # PR은 새 푸시가 옛 실행을 취소하고, main은 커밋마다 따로 돈다(취소되면 그 커밋 배포가 안 난다).
  group: kumoniji-ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 계정 테스트는 실제 Postgres에 임시 DB를 만들었다 지운다(tests/accounts/conftest.py)
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: kumoniji
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: kumoniji
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kumoniji" --health-interval 5s --health-retries 10
    env:
      KUMONIJI_TEST_DATABASE_URL: postgresql://kumoniji:ci@127.0.0.1:5432/postgres
    defaults:
      run:
        working-directory: kumoniji/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt pytest httpx
      - run: pytest -q

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: kumoniji/app
    steps:
      - uses: actions/checkout@v4
      # 로컬(~/.cache/gildle-build/flutter)과 같은 버전
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
