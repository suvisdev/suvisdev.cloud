# 쿠모니지 CI — 서버 pytest(규칙 하네스 포함) + 앱 analyze·test. 배포는 노트북에서 kumoniji/deploy.sh(수동).
name: kumoniji-ci

on:
  push:
    branches: [main]
    paths:
      - "kumoniji/**"
      - ".github/workflows/kumoniji-ci.yml"
  pull_request:
    paths:
      - "kumoniji/**"
      - ".github/workflows/kumoniji-ci.yml"
  workflow_dispatch:

concurrency:
  group: kumoniji-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 계정 테스트는 실제 Postgres에 임시 DB를 만들었다 지운다(tests/accounts/conftest.py)
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: kumoniji
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: kumoniji
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kumoniji" --health-interval 5s --health-retries 10
    env:
      KUMONIJI_TEST_DATABASE_URL: postgresql://kumoniji:ci@127.0.0.1:5432/postgres
    defaults:
      run:
        working-directory: kumoniji/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt pytest httpx
      - run: pytest -q

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: kumoniji/app
    steps:
      - uses: actions/checkout@v4
      # 로컬(~/.cache/gildle-build/flutter)과 같은 버전
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
