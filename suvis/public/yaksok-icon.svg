<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <clipPath id="cap"><rect x="17" y="26" width="30" height="12" rx="6"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0B1220"/>
  <!-- 뷰파인더 네 모서리 — 원형 타일에서도 잘리지 않게 안쪽(14~50)에 -->
